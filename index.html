<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>奶蛙零 · Naiwa Zero</title>
  <script type="module" crossorigin src="./assets/index-Dk8cbfW4.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-B-IeMant.css">
</head>
<body>
  <canvas id="gl"></canvas>

  <!-- 主界面 -->
  <div id="screen-title" class="screen">
    <div class="title-bg"></div>
    <div class="title-char" id="title-char"></div>
    <div class="title-particles" id="title-particles"></div>
    <div class="title-inner">
      <div class="game-logo">
        <div class="logo-main">奶蛙零</div>
        <div class="logo-sub">NAIWA ZERO</div>
        <div class="logo-ver">VOL.0 · 连携短局</div>
      </div>
      <div class="title-menu">
        <button class="menu-btn primary" data-action="start">
          <span class="btn-icon">▶</span>
          <span class="btn-text">开始作战</span>
        </button>
        <button class="menu-btn" data-action="characters">
          <span class="btn-icon">☰</span>
          <span class="btn-text">角色名册</span>
        </button>
        <button class="menu-btn" data-action="settings">
          <span class="btn-icon">⚙</span>
          <span class="btn-text">设置</span>
        </button>
      </div>
      <div class="title-footer">
        <span class="hint">WASD 移动 · 空格 攻击 · Shift 闪避 · Tab 接力</span>
        <span class="copy">非官方 · 无关联 · 戏仿作品</span>
      </div>
    </div>
    <div class="title-vignette"></div>
  </div>

  <!-- 角色选择 -->
  <div id="screen-select" class="screen hidden">
    <div class="select-inner">
      <div class="select-left">
        <div class="select-header">
          <h2>选择出战角色</h2>
          <span class="select-count" id="select-count">16 名成员</span>
        </div>
        <div class="select-list" id="select-list"></div>
      </div>
      <div class="select-right">
        <div class="showcase">
          <div class="showcase-img" id="showcase-img"></div>
          <div class="showcase-name" id="showcase-name">奶蛙</div>
          <div class="showcase-role" id="showcase-role">主攻</div>
          <div class="showcase-stats" id="showcase-stats"></div>
        </div>
        <div class="select-actions">
          <button class="menu-btn" data-action="back-title">返回</button>
          <button class="menu-btn primary" data-action="confirm">出战 →</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 战斗 HUD -->
  <div id="ui"></div>

  <!-- 结算 -->
  <div id="screen-result" class="screen hidden">
    <div class="result-inner">
      <div class="result-title" id="result-title">作战完成</div>
      <div class="result-grade" id="result-grade">S</div>
      <div class="result-stats" id="result-stats"></div>
      <div class="result-rewards" id="result-rewards"></div>
      <div class="result-actions">
        <button class="menu-btn" data-action="back-title">返回主界面</button>
        <button class="menu-btn primary" data-action="restart">再来一局</button>
      </div>
    </div>
  </div>

  <!-- 设置 -->
  <div id="screen-settings" class="screen hidden">
    <div class="settings-inner">
      <h2>设置</h2>
      <div class="setting-row">
        <span>渲染风格</span>
        <div class="setting-opts">
          <button class="opt active" data-opt="npr">NPR</button>
          <button class="opt" data-opt="pbr">PBR</button>
        </div>
      </div>
      <div class="setting-row">
        <span>色调分离</span>
        <div class="setting-opts">
          <button class="opt" data-opt="3">3 档</button>
          <button class="opt active" data-opt="4">4 档</button>
          <button class="opt" data-opt="5">5 档</button>
        </div>
      </div>
      <div class="setting-row">
        <span>音量</span>
        <input type="range" min="0" max="100" value="70" id="vol-slider" />
      </div>
      <div class="setting-row">
        <span>画质</span>
        <div class="setting-opts">
          <button class="opt" data-opt="low">低</button>
          <button class="opt active" data-opt="med">中</button>
          <button class="opt" data-opt="high">高</button>
        </div>
      </div>
      <button class="menu-btn" data-action="back-title">返回</button>
    </div>
  </div>

  <div id="toast"></div>

</body>
</html>
