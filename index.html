<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>奶蛙零 · Naiwa Zero</title>
  <link rel="stylesheet" href="/src/ui/style.css" />
  <link rel="stylesheet" href="/src/ui/glass.css" />
  <link rel="stylesheet" href="/src/ui/screens.css" />
</head>
<body>
  <canvas id="gl"></canvas>

  <!-- 主界面 -->
  <div id="screen-title" class="screen">
    <!-- 首页视频背景：muted autoplay 保证画面一定动，声音由 titlefx.mjs 尽力解锁 -->
    <video id="title-video" class="title-video" muted autoplay loop playsinline preload="auto" poster="./bg/title-poster.jpg">
      <source src="./bg/title.mp4" type="video/mp4" />
    </video>
    <div class="title-bg"></div>
    <!-- WebGL 液态玻璃透镜层：在视频之上、文字之下 -->
    <canvas id="glass-layer" class="glass-layer"></canvas>
    <button id="title-sound" class="title-sound" type="button" aria-label="开启声音">🔇 开启声音</button>
    <div class="title-particles" id="title-particles"></div>
    <div class="title-inner">
      <div class="game-logo">
        <div class="logo-main" aria-label="奶蛙零"><span>奶</span><span>蛙</span><span>零</span></div>
      </div>
      <div class="title-menu">
        <button class="menu-btn primary" data-action="start">
          <span class="btn-icon">▶</span>
          <span class="btn-text">开始作战</span>
        </button>
        <button class="menu-btn" data-action="characters">
          <span class="btn-icon">☰</span>
          <span class="btn-text">角色名册</span>
        </button>
        <button class="menu-btn" data-action="settings">
          <span class="btn-icon">⚙</span>
          <span class="btn-text">设置</span>
        </button>
      </div>
      <div class="title-footer">
        <span class="hint">WASD 移动 · 空格 攻击 · Shift 闪避 · Tab 接力</span>
        <span class="copy">非官方 · 无关联 · 戏仿作品</span>
      </div>
    </div>
    <div class="title-vignette"></div>
  </div>

  <!-- 角色选择 -->
  <div id="screen-select" class="screen hidden">
    <div class="select-inner glass">
      <!-- 实时 3D 角色层：16 只 GLB 按卡片位置渲染，卡片 DOM 透明叠在上面 -->
      <canvas id="live3d-layer" class="live3d-layer"></canvas>
      <div class="select-left">
        <div class="select-header">
          <h2>队伍编成</h2>
          <span class="select-count" id="select-count">16 名成员</span>
        </div>
        <div class="select-list" id="select-list"></div>
      </div>
      <div class="select-right">
        <div class="archive glass">
          <div class="archive-head">
            <div class="archive-avatar" id="archive-avatar"></div>
            <div class="archive-id">
              <div class="archive-name" id="showcase-name">奶蛙</div>
              <div class="archive-role" id="showcase-role">主攻</div>
              <div class="archive-lv">
                <span class="archive-lv-label">LV.45</span>
                <span class="archive-lv-bar"><i style="width:72%"></i></span>
              </div>
            </div>
          </div>
          <div class="archive-art" id="showcase-img"></div>
          <div class="archive-stats" id="showcase-stats"></div>
          <div class="archive-tabs">
            <button class="atab active" data-tab="stat">属性</button>
            <button class="atab" data-tab="move">招式</button>
            <button class="atab" data-tab="voice">音羽</button>
          </div>
        </div>
        <div class="select-actions">
          <button class="menu-btn" data-action="back-title">返回</button>
          <button class="menu-btn primary" data-action="confirm">出战 →</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 战斗 HUD -->
  <div id="ui"></div>

  <!-- 结算 -->
  <div id="screen-result" class="screen hidden">
    <div class="result-inner glass">
      <div class="result-title" id="result-title">作战完成</div>
      <div class="result-grade" id="result-grade">S</div>
      <div class="result-rounds" id="result-rounds"></div>
      <div class="result-stats" id="result-stats"></div>
      <div class="result-rewards" id="result-rewards"></div>
      <div class="result-actions">
        <button class="menu-btn" data-action="back-title">返回主界面</button>
        <button class="menu-btn primary" data-action="restart">再来一局</button>
      </div>
    </div>
  </div>

  <!-- 设置 -->
  <div id="screen-settings" class="screen hidden">
    <div class="settings-inner glass">
      <h2>设置</h2>
      <div class="setting-row">
        <span>渲染风格</span>
        <div class="setting-opts">
          <button class="opt active" data-opt="npr">NPR</button>
          <button class="opt" data-opt="pbr">PBR</button>
        </div>
      </div>
      <div class="setting-row">
        <span>色调分离</span>
        <div class="setting-opts">
          <button class="opt" data-opt="3">3 档</button>
          <button class="opt active" data-opt="4">4 档</button>
          <button class="opt" data-opt="5">5 档</button>
        </div>
      </div>
      <div class="setting-row">
        <span>音量</span>
        <input type="range" min="0" max="100" value="70" id="vol-slider" />
      </div>
      <div class="setting-row">
        <span>外观</span>
        <div class="setting-opts">
          <button class="opt active" data-opt="system">跟随系统</button>
          <button class="opt" data-opt="light">浅色</button>
          <button class="opt" data-opt="dark">深色</button>
        </div>
      </div>
      <div class="setting-row">
        <span>画质</span>
        <div class="setting-opts">
          <button class="opt" data-opt="low">低</button>
          <button class="opt active" data-opt="med">中</button>
          <button class="opt" data-opt="high">高</button>
        </div>
      </div>
      <button class="menu-btn" data-action="back-title">返回</button>
    </div>
  </div>

  <div id="toast"></div>

  <script type="module" src="/src/main.mjs"></script>
</body>
</html>
